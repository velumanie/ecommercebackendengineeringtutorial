# docker-compose variant of prometheus.yml — no Kubernetes API to discover pods from,
# so targets are listed statically by container name (Docker Compose's embedded DNS
# resolves these the same way ClusterIP Service names do in Kubernetes).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: ecommerce-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway-service:8080
          - user-service:8081
          - product-service:8082
          - inventory-service:8083
          - order-service:8084
          - payment-service:8085
          - notification-service:8086
        labels: { environment: local }
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
