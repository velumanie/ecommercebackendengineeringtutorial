input {
  beats { port => 5044 }
}

filter {
  json { source => "message" }
  date { match => ["timestamp", "ISO8601"] target => "@timestamp" }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "ecommerce-%{[docker][container][labels][com_docker_compose_service]}-%{+YYYY.MM.dd}"
  }
}
