plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'jacoco'
}

description = 'Order Service — order lifecycle, orchestrates inventory reservation and payment authorization'

dependencies {
    implementation project(':common')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.kafka:spring-kafka'

    implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
    // Provides the CircuitBreakerFactory bean feign.circuitbreaker.enabled needs — without it,
    // Feign never wraps calls with a circuit breaker and fallbackFactory is silently never invoked.
    // Spring Cloud 2025.1.2's circuitbreaker starter still transitively pulls the Boot-3-only
    // resilience4j-spring-boot3 autoconfigure module, which double-registers beans against our
    // resilience4j-spring-boot4 above — exclude it, the core resilience4j-circuitbreaker library
    // (still pulled transitively) is all spring-cloud-circuitbreaker-resilience4j actually needs.
    implementation('org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j') {
        exclude group: 'io.github.resilience4j', module: 'resilience4j-spring-boot3'
    }
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'


    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'PACKAGE'
            includes = ['com.ecommerce.order.service*', 'com.ecommerce.order.mapper*']
            limit { minimum = 0.80 }
        }
    }
}

test {
    finalizedBy jacocoTestReport
}
