spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/orders_db
    username: orders_user
    password: ${DB_PASSWORD:orders_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-service
      auto-offset-reset: earliest

server:
  port: 8084

feign:
  client:
    config:
      inventory-service:
        connectTimeout: 2000
        readTimeout: 3000
      payment-service:
        connectTimeout: 2000
        readTimeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      inventory-service:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
      payment-service:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
  retry:
    instances:
      inventory-service:
        max-attempts: 3
        wait-duration: 200ms
  bulkhead:
    instances:
      inventory-service:
        max-concurrent-calls: 25

security:
  jwt:
    secret: ${JWT_SECRET:change-me-in-every-environment-this-is-dev-only-do-not-use-in-production-0123456789}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: order-service
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: logstash
  level:
    com.ecommerce.order: INFO

---
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    discovery:
      client:
        simple:
          instances:
            inventory-service[0]:
              uri: http://inventory-service:8083
            payment-service[0]:
              uri: http://payment-service:8085
            product-service[0]:
              uri: http://product-service:8082
  datasource:
    url: jdbc:postgresql://postgres-orders:5432/orders_db
  kafka:
    bootstrap-servers: kafka:9092
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://otel-collector:4318/v1/metrics

---
spring:
  config:
    activate:
      on-profile: kubernetes
  cloud:
    discovery:
      client:
        simple:
          instances:
            inventory-service[0]:
              uri: http://inventory-service.ecommerce.svc.cluster.local
            payment-service[0]:
              uri: http://payment-service.ecommerce.svc.cluster.local
            product-service[0]:
              uri: http://product-service.ecommerce.svc.cluster.local
  datasource:
    url: jdbc:postgresql://postgres-orders.data.svc.cluster.local:5432/orders_db
  kafka:
    bootstrap-servers: kafka-broker-0.kafka.data.svc.cluster.local:9092,kafka-broker-1.kafka.data.svc.cluster.local:9092,kafka-broker-2.kafka.data.svc.cluster.local:9092
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://otel-collector.observability.svc.cluster.local:4318/v1/metrics
logging:
  level:
    com.ecommerce.order: WARN

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///orders_test
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
