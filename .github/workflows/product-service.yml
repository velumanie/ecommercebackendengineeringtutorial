name: product-service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "product-service/**"
      - "common/**"
      - ".github/workflows/product-service.yml"
  pull_request:
    paths:
      - "product-service/**"
      - "common/**"

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }

      - name: Build
        run: ./gradlew :product-service:compileJava --no-daemon

      - name: Unit + integration tests
        run: ./gradlew :product-service:test --no-daemon

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew :product-service:sonar --no-daemon -Dsonar.host.url=${{ vars.SONAR_HOST_URL }}
