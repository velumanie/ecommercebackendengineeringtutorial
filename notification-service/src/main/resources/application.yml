spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/notifications_db
    username: notifications_user
    password: ${DB_PASSWORD:notifications_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

server:
  port: 8086

security:
  jwt:
    secret: ${JWT_SECRET:change-me-in-every-environment-this-is-dev-only-do-not-use-in-production-0123456789}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: notification-service
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: logstash

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres-notifications:5432/notifications_db
  kafka:
    bootstrap-servers: kafka:9092
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://otel-collector:4318/v1/metrics

---
spring:
  config:
    activate:
      on-profile: kubernetes
  datasource:
    url: jdbc:postgresql://postgres-notifications.data.svc.cluster.local:5432/notifications_db
  kafka:
    bootstrap-servers: kafka-broker-0.kafka.data.svc.cluster.local:9092,kafka-broker-1.kafka.data.svc.cluster.local:9092,kafka-broker-2.kafka.data.svc.cluster.local:9092
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://otel-collector.observability.svc.cluster.local:4318/v1/metrics
