spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          # No browser client can call this API cross-origin without an explicit policy —
          # Spring allows nothing by default. Origins are env-driven so prod doesn't inherit
          # the localhost dev default; allowCredentials stays false since auth is a bearer
          # token in the Authorization header, not a cookie, so there's no CSRF-adjacent
          # reason to allow credentialed cross-origin requests.
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowedMethods: [ GET, POST, PUT, PATCH, DELETE, OPTIONS ]
                allowedHeaders: [ Authorization, Content-Type, Idempotency-Key, X-Correlation-Id ]
                exposedHeaders: [ X-Correlation-Id, Location ]
                allowCredentials: false
                maxAge: 3600
          routes:
            - id: user-service-auth
              uri: http://user-service
              predicates: [ "Path=/users/auth/**" ]
              filters:
                - "RewritePath=/users/auth/(?<segment>.*), /api/v1/auth/$\\{segment}"
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 5
                    key-resolver: "#{@ipKeyResolver}"

            - id: user-service
              uri: http://user-service
              predicates: [ "Path=/users,/users/**" ]
              filters:
                - "RewritePath=/users(?<segment>/?.*), /api/v1/users$\\{segment}"
                - name: CircuitBreaker
                  args: { name: userServiceCB, fallbackUri: "forward:/fallback/user-service" }

            - id: product-service
              uri: http://product-service
              predicates: [ "Path=/products,/products/**" ]
              filters:
                - "RewritePath=/products(?<segment>/?.*), /api/v1/products$\\{segment}"
                - name: CircuitBreaker
                  args: { name: productServiceCB, fallbackUri: "forward:/fallback/product-service" }

            - id: inventory-service
              uri: http://inventory-service
              predicates: [ "Path=/inventory,/inventory/**" ]
              filters:
                - "RewritePath=/inventory(?<segment>/?.*), /api/v1/inventory$\\{segment}"

            - id: order-service
              uri: http://order-service
              predicates: [ "Path=/orders,/orders/**" ]
              filters:
                - "RewritePath=/orders(?<segment>/?.*), /api/v1/orders$\\{segment}"
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args: { name: orderServiceCB, fallbackUri: "forward:/fallback/order-service" }

            - id: payment-service
              uri: http://payment-service
              predicates: [ "Path=/payments,/payments/**" ]
              filters:
                - "RewritePath=/payments(?<segment>/?.*), /api/v1/payments$\\{segment}"
                - name: CircuitBreaker
                  args: { name: paymentServiceCB, fallbackUri: "forward:/fallback/payment-service" }

            - id: notification-service
              uri: http://notification-service
              predicates: [ "Path=/notifications,/notifications/**" ]
              filters:
                - "RewritePath=/notifications(?<segment>/?.*), /api/v1/notifications$\\{segment}"
                - name: CircuitBreaker
                  args: { name: notificationServiceCB, fallbackUri: "forward:/fallback/notification-service" }

security:
  jwt:
    secret: ${JWT_SECRET:change-me-in-every-environment-this-is-dev-only-do-not-use-in-production-0123456789}

resilience4j:
  circuitbreaker:
    configs:
      default:
        # minimum-number-of-calls and permitted-number-of-calls-in-half-open-state both default
        # to values (100 and 10) that assume a much larger sliding-window-size than the 20 every
        # instance below actually uses. With minimum-number-of-calls left at its default, a
        # 20-slot COUNT_BASED window can never hold enough calls to satisfy it, so the failure
        # rate is never considered statistically valid — under bursty concurrent load this leaves
        # a breaker flapping between OPEN and HALF_OPEN indefinitely, permanently short-circuiting
        # real traffic, even once the backing service is fully healthy again. Both need to fit
        # inside the smaller window explicitly, not just failure-rate-threshold/wait-duration.
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 5
    instances:
      userServiceCB: { sliding-window-size: 20, failure-rate-threshold: 50, wait-duration-in-open-state: 10s }
      productServiceCB: { sliding-window-size: 20, failure-rate-threshold: 50, wait-duration-in-open-state: 10s }
      orderServiceCB: { sliding-window-size: 20, failure-rate-threshold: 50, wait-duration-in-open-state: 10s }
      paymentServiceCB: { sliding-window-size: 20, failure-rate-threshold: 50, wait-duration-in-open-state: 15s }
      notificationServiceCB: { sliding-window-size: 20, failure-rate-threshold: 50, wait-duration-in-open-state: 10s }
  timelimiter:
    instances:
      # The gateway's CircuitBreaker filter defaults every instance's call timeout to 1s, which
      # is fine for typical CRUD reads but too tight for user-service specifically: BCrypt at
      # strength 12 is deliberately CPU-expensive (~250-700ms per hash, by design — not a bug to
      # optimize away), and login/signup each do at least one hash. A single request already
      # measures ~700ms with zero concurrent load; any real concurrency pushes it past 1s and the
      # TimeLimiter counts an otherwise-successful call as a circuit-breaker failure. 3s gives
      # BCrypt room under load without meaningfully weakening the "is user-service actually down"
      # signal the breaker exists for.
      userServiceCB: { timeout-duration: 3s }

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  metrics:
    tags:
      application: gateway-service
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

logging:
  structured:
    format:
      console: logstash

