---
spring:
  config:
    activate:
      on-profile: kubernetes
  data:
    redis:
      host: redis.ecommerce.svc.cluster.local
      # Explicit, not inherited from the base ${REDIS_PORT:6379} placeholder: Kubernetes
      # auto-injects a REDIS_PORT env var into every pod in this namespace because a Service
      # named "redis" exists here (Docker-links compatibility, e.g. "tcp://10.x.x.x:6379"),
      # which collides with and overrides that placeholder — binding a URI string where an
      # int is expected and crashing ApplicationContext startup.
      port: 6379
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://otel-collector.observability.svc.cluster.local:4318/v1/metrics
