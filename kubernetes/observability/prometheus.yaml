# Reference-tier Prometheus: single replica, in-memory-only retention window, no
# long-term remote-write. For a real production install, prefer the
# prometheus-community/kube-prometheus-stack Helm chart (Prometheus Operator +
# Alertmanager + node-exporter + kube-state-metrics pre-wired) over hand-rolled
# manifests like this one — this exists so `kubectl apply -f kubernetes/observability/`
# gives you a working stack with zero external chart dependencies.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert-rules.yml

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [ecommerce] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: application
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector:8889"]
  alert-rules.yml: |
    groups:
      - name: ecommerce-platform
        rules:
          - alert: HighErrorRate
            expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.02
            for: 5m
            labels: { severity: critical }
            annotations: { summary: "{{ $labels.application }} error rate above 2%" }
          - alert: HighP99Latency
            expr: histogram_quantile(0.99, rate(http_server_requests_seconds_bucket[5m])) > 1
            for: 5m
            labels: { severity: warning }
            annotations: { summary: "{{ $labels.application }} p99 latency above 1s" }
          - alert: KafkaConsumerLagHigh
            expr: kafka_consumer_lag_records > 10000
            for: 10m
            labels: { severity: warning }
            annotations: { summary: "Consumer group {{ $labels.group }} lag above 10k records" }
          - alert: PodRestartLoop
            expr: increase(kube_pod_container_status_restarts_total{namespace="ecommerce"}[15m]) > 3
            labels: { severity: critical }
            annotations: { summary: "{{ $labels.pod }} restarting repeatedly" }
          - alert: HpaAtMaxReplicas
            expr: kube_horizontalpodautoscaler_status_current_replicas == kube_horizontalpodautoscaler_spec_max_replicas
            for: 15m
            labels: { severity: warning }
            annotations: { summary: "{{ $labels.horizontalpodautoscaler }} sustained at max replicas — consider raising the ceiling" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            # Lets k6 push load-test metrics straight in via --out experimental-prometheus-rw
            # (see loadtest/README.md) so a run shows up next to the app's own golden-signal
            # dashboards instead of only existing as terminal output that vanishes after the run.
            - --web.enable-remote-write-receiver
          ports:
            - containerPort: 9090
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
