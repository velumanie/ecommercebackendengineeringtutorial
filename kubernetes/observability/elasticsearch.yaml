# Single-node, dev-tier Elasticsearch — no security, no replicas, ephemeral-friendly
# storage class. A real deployment uses the Elastic Cloud on Kubernetes (ECK) operator
# or a managed Elasticsearch offering, not a hand-rolled StatefulSet like this one.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: observability
spec:
  serviceName: elasticsearch
  replicas: 1
  selector: { matchLabels: { app: elasticsearch } }
  template:
    metadata: { labels: { app: elasticsearch } }
    spec:
      initContainers:
        - name: increase-vm-max-map-count
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext: { privileged: true }
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.16.1
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms1g -Xmx1g" }
          ports:
            - { containerPort: 9200, name: http }
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits: { cpu: "2", memory: "3Gi" }
          readinessProbe:
            httpGet: { path: /_cluster/health, port: 9200 }
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: observability
spec:
  selector: { app: elasticsearch }
  ports:
    - { port: 9200, targetPort: 9200 }
