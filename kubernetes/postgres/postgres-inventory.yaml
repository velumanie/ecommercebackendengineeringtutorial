apiVersion: v1
kind: Secret
metadata:
  name: postgres-inventory-secret
  namespace: data
type: Opaque
stringData:
  POSTGRES_DB: inventory_db
  POSTGRES_USER: inventory_user
  POSTGRES_PASSWORD: change-me
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-inventory
  namespace: data
spec:
  serviceName: postgres-inventory
  replicas: 1
  selector: { matchLabels: { app: postgres-inventory } }
  template:
    metadata: { labels: { app: postgres-inventory } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          envFrom: [{ secretRef: { name: postgres-inventory-secret } }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "4Gi" }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "inventory_user"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "inventory_user"] }
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 50Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-inventory
  namespace: data
spec:
  clusterIP: None
  selector: { app: postgres-inventory }
  ports:
    - port: 5432
      targetPort: 5432
