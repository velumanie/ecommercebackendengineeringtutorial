# Dev/qa apply this directly; uat/prod overwrite it via the external secrets operator
# after this chart deploys — values here are never real outside local/dev.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "order-service.fullname" . }}-secret
  namespace: {{ .Values.global.namespace | default "ecommerce" }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.dbPassword | default "change-me" | quote }}
  JWT_SECRET: {{ .Values.jwtSecret | default "change-me-in-every-environment-this-is-dev-only-do-not-use-in-production-0123456789" | quote }}
