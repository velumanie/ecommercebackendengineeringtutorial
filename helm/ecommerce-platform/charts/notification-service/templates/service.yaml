apiVersion: v1
kind: Service
metadata:
  name: {{ include "notification-service.fullname" . }}
  namespace: {{ .Values.global.namespace | default "ecommerce" }}
spec:
  type: ClusterIP
  selector:
    {{- include "notification-service.labels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: {{ .Values.containerPort }}
