# Shared defaults every environment values file overrides selectively.
global:
  namespace: ecommerce
  imageRegistry: registry.company.com/ecommerce
  imageTag: latest

order-service:
  replicaCount: 3
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling: { minReplicas: 3, maxReplicas: 10, targetCPUUtilization: 70 }
  logLevel: INFO

